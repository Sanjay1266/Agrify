<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Agrify</title>
    <link rel="stylesheet" href="../assets/css/auth.css">
    <link rel="icon" href="../assets/images/icon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="auth-nav-header">
        <a href="../index.html"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
    </header>

    <main class="auth-main">
        <form id="signupForm" method="POST" action="#" onsubmit="return validate(event)" onreset="resetForm()">
            <fieldset>
                <h2>Create Your Account</h2>

                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" placeholder="Enter full name" onkeydown="handleKeyDown(event)">
                <span class="error" id="nameError"></span>

                <label for="username">Username:</label>
                <input type="text" id="username" name="username" placeholder="Choose username" onkeydown="handleKeyDown(event)">
                <span class="error" id="usernameError"></span>

                <label for="password">Password:</label>
                <input type="password" id="password" name="password" placeholder="Create password" onkeydown="handleKeyDown(event)">
                <span class="error" id="passwordError"></span>

                <input type="submit" value="Sign Up">
                <input type="reset" value="Reset">

                <span class="auth-switch">Already registered? <a href="login.html">Login here</a></span>
            </fieldset>
        </form>
    </main>

    <script>
        function validate(event) {
            let isValid = true;

            const namePattern = /^[A-Za-z\s]{3,}$/; 
            const usernamePattern = /^[a-zA-Z][a-zA-Z0-9]{2,14}$/; 
            const passwordPattern = /^(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&#])[A-Za-z\d@$!%*?&#]{8,}$/;
            
            const name = document.getElementById("name").value.trim();
            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value.trim();

            if (!namePattern.test(name)) {
                document.getElementById("nameError").innerHTML = "Name must be at least 3 letters (only alphabets & spaces).";
                isValid = false;
            } else {
                document.getElementById("nameError").innerHTML = "";
            }

            if (!usernamePattern.test(username)) {
                document.getElementById("usernameError").innerHTML = "Username must be 3-15 alphanumeric characters.";
                isValid = false;
            } else {
                document.getElementById("usernameError").innerHTML = "";
            }

            if (!passwordPattern.test(password)) {
                document.getElementById("passwordError").innerHTML = "Password must be 8+ chars, 1 uppercase, 1 number, 1 special character.";
                isValid = false;
            } else {
                document.getElementById("passwordError").innerHTML = "";
            }

            return isValid;
        }

        function resetForm() {
            document.getElementById("nameError").innerHTML = "";
            document.getElementById("usernameError").innerHTML = "";
            document.getElementById("passwordError").innerHTML = "";
        }

        document.getElementById("signupForm").addEventListener("submit", async function(event) {
            event.preventDefault();
            if (!validate(event)) return;

            const name = document.getElementById("name").value.trim();
            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value.trim();

            try {
                const response = await fetch("http://localhost:3001/register", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name, username, password })
                });

                const result = await response.json();
                if (response.ok) {
                    alert("Signup successful! Redirecting to login.");
                    window.location.href = "login.html";
                } else {
                    // Demo / fallback support
                    localStorage.setItem("username", username);
                    localStorage.setItem("name", name);
                    alert("Signup successful! Redirecting to login.");
                    window.location.href = "login.html";
                }
            } catch (error) {
                // Offline fallback
                localStorage.setItem("username", username);
                localStorage.setItem("name", name);
                alert("Signup successful! Redirecting to login.");
                window.location.href = "login.html";
            }
        });

        function handleKeyDown(event) {
            if (event.key === "Enter") {
                event.preventDefault(); 
                if (validate(event)) { 
                    document.querySelector("input[type='submit']").click(); 
                }
            }
        }
    </script>
</body>
</html>
